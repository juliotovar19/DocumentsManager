name: Deploy DocumentsManager

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install CDK
        run: npm install -g aws-cdk
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build all projects
        run: dotnet build --no-restore
      
      - name: Publish Publisher
        run: |
          dotnet publish src/DocumentsManager.Publisher -c Release -o bin/publish/publisher
          
      - name: Publish Subscriber
        run: |
          dotnet publish src/DocumentsManager.Subscriber -c Release -o bin/publish/subscriber
          
      - name: Publish Target
        run: |
          dotnet publish src/DocumentsManager.Target -c Release -o bin/publish/target
      
      - name: CDK Synth
        run: |
          cd src/DocumentsManager.Infra
          cdk synth
      
      - name: CDK Bootstrap (si es necesario)
        run: |
          cd src/DocumentsManager.Infra
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}
      
      - name: CDK Deploy
        run: |
          cd src/DocumentsManager.Infra
          cdk deploy --require-approval never --verbose