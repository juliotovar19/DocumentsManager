name: Deploy DocumentsManager

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install CDK
        run: |
          npm install -g aws-cdk
          cdk --version
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: List files structure
        run: |
          pwd
          ls -la
          ls -la src/
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build all projects
        run: dotnet build
      
      - name: Publish Lambdas
        run: |
          dotnet publish src/DocumentsManager.Publisher -c Release
          dotnet publish src/DocumentsManager.Subscriber -c Release
          dotnet publish src/DocumentsManager.Target -c Release
          echo "Publish completed"
      
      - name: CDK Synth
        run: |
          cd src/DocumentsManager.Infra
          cdk synth --verbose
      
      - name: CDK Bootstrap
        run: |
          cd src/DocumentsManager.Infra
          cdk bootstrap --verbose
      
      - name: CDK Deploy
        run: |
          cd src/DocumentsManager.Infra
          cdk deploy --require-approval never --verbose